fly-on-other: '<green>Flight enabled for <white><player></white>.'
fly-off-other: '<red>Flight disabled for <white><player></white>.'
flyspeed-set: '<green>Flight speed for <white><player></white> set to <white><value></white>.'
gamemode-set-self: '<green>Game mode set to <white><mode></white>.'

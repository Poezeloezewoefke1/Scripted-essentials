plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
    archivesName = 'forgotten'
}

sourceSets {
    main {
        // The platform-free logic is compiled straight into the mod rather than shipped as a
        // nested jar: it is small, and this keeps one jar with no jar-in-jar.
        java.srcDir '../logic/src/main/java'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        forgotten {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    accessWidenerPath = file('src/main/resources/forgotten.accesswidener')

    runs {
        // Boots a dedicated server with the mod, runs every @GameTest in the mod's
        // "fabric-gametest" entrypoints, writes a JUnit report and exits non-zero on failure.
        gametest {
            server()
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('junit.xml').get().asFile}"
            runDir 'build/gametest'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    // Report every error in one CI run rather than the first hundred.
    it.options.compilerArgs << '-Xmaxerrs' << '2000'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

name: Forgotten mod (Fabric 1.21.11)

# Builds and tests the Fabric mod in forgotten/. This is the only place the mod itself is
# compiled: its development environment cannot reach maven.fabricmc.net or Mojang's servers,
# which Loom needs for Minecraft, mappings and Fabric. The logic module's unit tests run here
# too, and a dedicated server is booted with the mod to run its game tests.

on:
  push:
    branches: ['main', 'claude/**']
    paths: ['forgotten/**', '.github/workflows/forgotten.yml']
  pull_request:
    paths: ['forgotten/**', '.github/workflows/forgotten.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: forgotten
    steps:
      - uses: actions/checkout@v4

      # Loom 1.19 itself needs Java 25 to run. The mod is still compiled for Java 21
      # (options.release = 21), which is what Minecraft 1.21.11 runs on.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Record the toolchain versions being built against
        run: |
          echo "commit: $GITHUB_SHA"
          grep -E '^(minecraft_version|yarn_mappings|loader_version|loom_version|fabric_api_version)=' gradle.properties
          echo "latest published Yarn builds for 1.21.11:"
          curl -fsS https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml | grep -o '1\.21\.11+build\.[0-9]*' | sort -t. -k5 -n | uniq | tail -3 || true
          echo "latest published Fabric API builds for 1.21.11:"
          curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '0\.[0-9.]*+1\.21\.11' | tail -3 || true

      - name: Static checks (resources against vanilla 1.21.11, imports against Yarn and Fabric API)
        working-directory: .
        run: |
          set -e
          mkdir -p /tmp/ref
          curl -fsS -o /tmp/ref/registries.json https://raw.githubusercontent.com/misode/mcmeta/1.21.11-summary/registries/data.json
          git clone -q --depth 1 --branch 1.21.11 --filter=blob:none --sparse https://github.com/FabricMC/yarn /tmp/ref/yarn
          git -C /tmp/ref/yarn sparse-checkout set mappings
          git clone -q --depth 1 --branch 1.21.11 https://github.com/FabricMC/fabric /tmp/ref/fabric
          python3 -m pip install -q pillow
          python3 forgotten/tools/validate.py --vanilla /tmp/ref/registries.json --yarn /tmp/ref/yarn/mappings --fabric /tmp/ref/fabric

      - name: Unit tests (logic module)
        # skipMinecraft keeps Loom out of this step so these tests run even if the mod cannot.
        run: ./gradlew -PskipMinecraft=true :logic:test 2>&1 | tee ../logic.log; exit ${PIPESTATUS[0]}

      - name: Compile and package the mod
        run: ./gradlew :mod:build 2>&1 | tee ../mod-build.log; exit ${PIPESTATUS[0]}

      - name: Game tests on a dedicated server
        run: ./gradlew :mod:runGametest 2>&1 | tee ../gametest.log; exit ${PIPESTATUS[0]}

      - name: Summarise the failure
        if: failure()
        working-directory: .
        run: |
          for f in logic.log mod-build.log gametest.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            grep -E "error:|warning: \[removal\]|FAILED|Exception|Caused by|What went wrong" -A3 "$f" | grep -v "^\s*at " | head -150
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            forgotten/logic/build/reports/tests
            forgotten/mod/build/junit.xml
            forgotten/mod/build/gametest/logs
          if-no-files-found: ignore

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: forgotten-mod
          path: forgotten/mod/build/libs/*.jar
